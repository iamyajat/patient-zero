[project]
name = "patient-zero"
version = "0.1.0"
description = "AI Swarm Audit Framework: error propagation tests for multi-agent systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-ollama>=0.2",
    "datasets>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "statsmodels>=0.15.0",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
    "tabulate>=0.10.0",
]

[project.scripts]
pz = "patient_zero.cli:app"

[project.optional-dependencies]
dojo = [
    "agentdojo>=0.1.35",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patient_zero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
